[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-family-doctor"
version = "1.1.0"
description = "Local safety core for family health information coordination"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Hermes Family Doctor contributors"}]
keywords = ["hermes-agent", "health-information", "safety", "triage"]
classifiers = [
  "Development Status :: 3 - Alpha",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.scripts]
hermes-family-doctor = "family_health.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
family_health = [
  "resources/runtime-template/*.md",
  "resources/runtime-template/*.yaml",
  "resources/runtime-template/plugins/*/*.py",
  "resources/runtime-template/plugins/*/*.yaml",
  "resources/runtime-template/skills/*/*.md",
]

[tool.setuptools.exclude-package-data]
family_health = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation/tests"]
addopts = "-q"
